name: Android CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Apply MainViewModel party swap fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/atuy/yws1editor/MainViewModel.kt")
          source = path.read_text()
          old_member = "            val previousHandle = currentMembers[position].yokaiHandle\n"
          new_member = "            val previousMember = currentMembers[position]\n"
          old_swap = """                    swappedPosition -> {
                                  val previousEntry = state.entries.firstOrNull { it.handle == previousHandle }
                                  if (previousEntry == null) member else partyMemberFromEntry(member.position, previousEntry)
                              }
          """
          new_swap = "                    swappedPosition -> previousMember.copy(position = member.position)\n"
          if source.count(old_member) != 1 or source.count(old_swap) != 1:
              raise SystemExit("MainViewModel target block was not found exactly once")
          source = source.replace(old_member, new_member, 1).replace(old_swap, new_swap, 1)
          path.write_text(source)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/atuy/yws1editor/MainViewModel.kt
          if ! git diff --cached --quiet; then
            git commit -m "Prevent duplicate party members in editor state"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android Lint
        run: ./gradlew lintDebug lintRelease

      - name: Build with Gradle
        run: ./gradlew assembleDebug assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: app-release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
