name: Android CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Apply MainViewModel party swap fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/atuy/yws1editor/MainViewModel.kt")
          source = path.read_text()
          old = '''            val currentMembers = normalizePartyMembers(state.partyMembers, state.entries)
                      val previousHandle = currentMembers[position].yokaiHandle
                      val swappedPosition = currentMembers.indexOfFirst {
                          it.position != position && it.yokaiHandle == yokaiHandle
                      }
                      val updated = currentMembers.map { member ->
                          when (member.position) {
                              position -> partyMemberFromEntry(member.position, selectedEntry)
                              swappedPosition -> {
                                  val previousEntry = state.entries.firstOrNull { it.handle == previousHandle }
                                  if (previousEntry == null) member else partyMemberFromEntry(member.position, previousEntry)
                              }
                              else -> member
                          }
                      }
          '''
          new = '''            val currentMembers = normalizePartyMembers(state.partyMembers, state.entries)
                      val previousMember = currentMembers[position]
                      val swappedPosition = currentMembers.indexOfFirst {
                          it.position != position && it.yokaiHandle == yokaiHandle
                      }
                      val updated = currentMembers.map { member ->
                          when (member.position) {
                              position -> partyMemberFromEntry(member.position, selectedEntry)
                              swappedPosition -> previousMember.copy(position = member.position)
                              else -> member
                          }
                      }
          '''
          if old not in source:
              raise SystemExit("MainViewModel target block was not found")
          path.write_text(source.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/atuy/yws1editor/MainViewModel.kt
          if ! git diff --cached --quiet; then
            git commit -m "Prevent duplicate party members in editor state"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android Lint
        run: ./gradlew lintDebug lintRelease

      - name: Build with Gradle
        run: ./gradlew assembleDebug assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: app-release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
