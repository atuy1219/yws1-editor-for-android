name: Apply normal stat limits

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.event.pull_request.head.ref == 'agent/normal-stat-limits'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply stat-limit patch
        run: python3 .github/scripts/apply-normal-stat-limits.py

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/atuy/yws1editor/MainActivity.kt \
            app/src/main/java/com/atuy/yws1editor/MainViewModel.kt \
            app/src/main/java/com/atuy/yws1editor/yokai/YokaiStatRules.kt \
            app/src/test/java/com/atuy/yws1editor/yokai/YokaiStatRulesTest.kt
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Enforce natural IVA and IVB1 limits"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
