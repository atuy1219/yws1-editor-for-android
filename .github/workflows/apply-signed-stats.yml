name: Apply signed character stat fix

on:
  pull_request:
    branches: [main]
    paths:
      - .github/signed-stat-trigger

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply ROM-verified signed stat handling
        run: python3 .github/scripts/apply_signed_stats.py

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Commit and push to pull request branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix signed IVA and CB handling"
          git push origin HEAD:${{ github.head_ref }}
